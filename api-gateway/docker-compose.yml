version: "3.8"

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: deepshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  ai-engine:
    build:
      context: ../ai-engine
    ports:
      - "8500:8500"

  api-gateway:
    build:
      context: .
    environment:
      API_KEY: deepshield-local-key
      AI_ENGINE_URL: http://ai-engine:8500
    ports:
      - "8000:8000"
    depends_on:
      - ai-engine
      - postgres
