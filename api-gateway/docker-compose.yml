version: "3.8"

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: deepshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  ai-engine:
    build: ./ai-engine
    ports:
      - "8500:8500"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - ai-engine
      - postgres
